name: Nix CI

on:
  push:
    branches: [master, feat-flake-ci]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Evaluate flake
        run: nix flake check --no-build -L

      - name: Build the azerothcore package
        run: nix build .#default -L

      - name: Validate the process-compose wiring
        run: nix run .#dev -- --dry-run

  dev-smoke:
    needs: build
    runs-on: ubuntu-latest
    # Linux only: this exercises the full stack (MySQL + client-data download + dbimport
    # + authserver/worldserver boot)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build
        run: nix build .#default -L

      - name: Start the dev stack headlessly
        run: |
          PC_DISABLE_TUI=1 nohup nix run .#dev > dev.log 2>&1 &
          echo $! > dev.pid

      - name: Wait for authserver to come up
        run: |
          for i in $(seq 1 60); do
            nc -z 127.0.0.1 3724 && exit 0
            sleep 5
          done
          echo "authserver never opened port 3724 within 5 min"
          cat dev.log
          exit 1

      - name: Tear down
        if: always()
        run: |
          kill "$(cat dev.pid)" 2>/dev/null || true
          sleep 2
          cat dev.log
